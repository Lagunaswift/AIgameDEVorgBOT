name: Temporary gameidea verification

on:
  pull_request:

permissions:
  contents: read

env:
  GUILD_ID: '1051088980176805919'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
