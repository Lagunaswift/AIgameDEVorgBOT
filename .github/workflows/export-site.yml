# Scheduled site refresh: pulls Showcase games, Projects, screenshots, org stats, jams,
# and approved hosted-build relationships from Discord/Firestore into a staging clone
# of AIGAMEDEVSITE, validates and builds it, then promotes only generated data/assets.
# Vercel then deploys the site automatically. Also runnable on demand from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DISCORD_TOKEN            - the bot token (read access is enough)
#   FIREBASE_SERVICE_ACCOUNT - the service account JSON, single line
#   GUILD_ID                 - the Discord server id
#   SITE_PUSH_TOKEN          - fine-grained PAT with Contents read/write on
#                              Lagunaswift/AIGAMEDEVSITE
# Required repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   SITE_PUBLISH_TAG_ID      - Discord forum tag ID required for public Showcase export

name: Export site data

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

concurrency:
  group: export-site
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bot
        uses: actions/checkout@v4

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: Lagunaswift/AIGAMEDEVSITE
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install bot dependencies
        run: npm ci

      - name: Clone site into staging
        run: git clone --no-hardlinks site site-staging

      - name: Create staging asset directories
        run: mkdir -p site-staging/public/assets/showcase site-staging/public/assets/awards site-staging/public/assets/projects

      - name: Run Discord/public export into staging
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          SITE_PUBLISH_TAG_ID: ${{ vars.SITE_PUBLISH_TAG_ID }}
        run: node scripts/export-site-data.mjs --jams-forum 1539971669467332728 --out site-staging --report site-staging/export-report.json

      - name: Export hosted Build relationships into staging
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: node scripts/export-hosted-platform.mjs --out site-staging

      - name: Validate staged export
        run: node scripts/validate-site-export.mjs --candidate site-staging --previous site --report site-staging/export-report.json

      - name: Build staged site
        working-directory: site-staging
        run: npm install --no-audit --no-fund && npm run build

      - name: Promote validated generated data and assets
        run: |
          mkdir -p site-staging/public/assets/showcase site-staging/public/assets/awards site-staging/public/assets/projects
          mkdir -p site/src/data site/public/assets/showcase site/public/assets/awards site/public/assets/projects
          cp site-staging/src/data/projects.json site/src/data/projects.json
          cp site-staging/src/data/showcase.json site/src/data/showcase.json
          cp site-staging/src/data/jams.json site/src/data/jams.json
          cp site-staging/src/data/builds.json site/src/data/builds.json
          rsync -a --delete site-staging/public/assets/showcase/ site/public/assets/showcase/
          rsync -a --delete site-staging/public/assets/awards/ site/public/assets/awards/
          # Only the reserved exporter namespace participates in deletion. Manually
          # curated sibling assets under each Project slug are excluded and protected.
          rsync -a --delete --prune-empty-dirs \
            --include='*/' \
            --include='*/_discord-export/***' \
            --exclude='*' \
            site-staging/public/assets/projects/ site/public/assets/projects/

      - name: Commit and push site data
        working-directory: site
        run: |
          # Author as the repo owner so Vercel (which requires commit authors to
          # have a linked account) deploys the automated data commits.
          git config user.name "Lagunaswift"
          git config user.email "jamesswift1988@gmail.com"
          git add src/data/projects.json src/data/showcase.json src/data/jams.json src/data/builds.json public/assets/projects public/assets/showcase public/assets/awards
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Automated data refresh"
            git push
          fi
