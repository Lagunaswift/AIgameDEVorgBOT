name: Apply verified media source
on:
  push:
    branches: [feat/project-media-v2-3]
    paths: [.github/workflows/media-source-delivery.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lagunaswift/AIgameDEVorgBOT' && github.ref == 'refs/heads/feat/project-media-v2-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply integrity-checked source patch and remove delivery files
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess,tempfile
          parts=[pathlib.Path(f'.github/media-source.{i}.b64') for i in range(2)]
          encoded=''.join(p.read_text().strip() for p in parts)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)<1000000 and hashlib.sha256(raw).hexdigest()=='87bf466a6f0cbea11e7c662d0b37180c7f2a7c1e397817a775f3f748799a57c9'
          with tempfile.NamedTemporaryFile() as patch:
              patch.write(raw); patch.flush()
              stats=subprocess.check_output(['git','apply','--numstat','-z',patch.name]).decode().split('\0')[:-1]
              paths=sorted(row.split('\t',2)[2] for row in stats)
              assert paths==['.github/workflows/media-review-source.yml', 'docs/selected-project-media.md', 'scripts/export-site-data.mjs', 'scripts/selected-project-media.mjs', 'src/lib/project-media-contracts.mjs', 'test/project-export.test.mjs', 'test/project-media-contracts.test.mjs', 'test/selected-project-media.test.mjs']
              subprocess.run(['git','apply','--check',patch.name],check=True)
              subprocess.run(['git','apply',patch.name],check=True)
          for part in parts: part.unlink()
          pathlib.Path('.github/workflows/media-source-delivery.yml').unlink()
          print('Applied exact reviewed source patch; temporary files removed.')
          PY
          git diff --check
      - name: Commit this feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement creator-selected gallery V2.3; remove delivery tooling'
          cat > "$RUNNER_TEMP/media-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/media-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/media-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/project-media-v2-3
