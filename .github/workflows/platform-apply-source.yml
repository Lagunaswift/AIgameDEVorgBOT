name: Apply verified connection source
on:
  push:
    branches: [feat/platform-discovery-v2-6]
    paths: [.github/workflows/platform-apply-source.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lagunaswift/AIgameDEVorgBOT' && github.ref == 'refs/heads/feat/platform-discovery-v2-6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and apply the source patch
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          base='a0b6f17cb689dfc3fa6352cdd93e8b17b7e2e091'
          parts=[f'.platform/source-{i}.b64' for i in (1,2)]
          allowed=set(parts+['.github/workflows/platform-apply-source.yml'])
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          if not set(changed)<=allowed: raise SystemExit('Source changed since verified base')
          patch=lzma.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts),validate=True))
          if len(patch)!=19513 or hashlib.sha256(patch).hexdigest()!='c99fe2cf1a8f9f076fc52ec6e5765e3563f2f71511f6a2509b0e4a23926f7cd0': raise SystemExit('Patch integrity mismatch')
          target=pathlib.Path('/tmp/platform-source.patch');target.write_bytes(patch)
          paths=[line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(target)],text=True).splitlines()]
          if not paths or any(not p.startswith(('src/','scripts/','docs/','test/')) or '..' in p.split('/') for p in paths): raise SystemExit('Patch outside scope')
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--',*parts],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement approved Project discovery metadata export'
      - name: Push approved feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/feat/platform-discovery-v2-6
