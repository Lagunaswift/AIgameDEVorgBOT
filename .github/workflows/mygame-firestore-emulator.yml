name: Verify bot and Firestore transactions

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mygame-firestore-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GUILD_ID: '1051088980176805919'
    steps:
      - name: Checkout bot without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify reviewed branch ancestry
        run: |
          python3 - <<'PYANCESTRY'
          import pathlib,re,subprocess
          text=pathlib.Path('docs/branch-consolidation.md').read_text()
          tips=re.findall(r'^\| `[^`]+` \| `([0-9a-f]{40})` \|',text,re.M)
          assert len(tips)==14, 'Incomplete original Bot branch register'
          for tip in tips: subprocess.run(['git','merge-base','--is-ancestor',tip,'HEAD'],check=True)
          print('PASS: all 14 original Bot branch tips are ancestors of this candidate')
          PYANCESTRY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Verify bot suite against Firestore emulator
        env:
          GCLOUD_PROJECT: demo-aigdbot-r2
          REQUIRE_FIRESTORE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --only firestore
          --project demo-aigdbot-r2
          --config .github/firebase-emulator.json
          "node --test test/*.test.mjs"
