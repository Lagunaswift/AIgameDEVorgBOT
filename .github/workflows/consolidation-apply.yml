name: Apply reviewed consolidation source
on:
  push:
    branches: [chore/docs-and-branch-consolidation]
    paths: [.github/workflows/consolidation-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lagunaswift/AIgameDEVorgBOT' && github.ref == 'refs/heads/chore/docs-and-branch-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct exact reviewed files
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,re,subprocess
          base='515139e336da12f27f4481b2a1e9548052c253e2'
          changes=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          if any(p!='.github/workflows/consolidation-apply.yml' and not p.startswith('.consolidation/') for p in changes): raise SystemExit('Source moved since review')
          encoded=''.join(pathlib.Path(f'.consolidation/exact-{p}.b64').read_text().strip() for p in (1,2,3,4))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if len(raw)!=34470 or hashlib.sha256(raw).hexdigest()!='da77643e327464d371fa8c1320580059e2e0e75aec36b9d45b7c3347abf05e1f': raise SystemExit('Manifest integrity mismatch')
          entries=json.loads(raw);paths=[]
          if not isinstance(entries,list) or len(entries)!=18: raise SystemExit('Invalid manifest')
          for row in entries:
              p=row['path'];target=pathlib.Path(p)
              if p in paths or target.is_absolute() or '..' in target.parts or not (p in ['README.md','.env.example'] or p.startswith(('src/','test/','scripts/','docs/'))): raise SystemExit('Path outside scope')
              if any(parent.is_symlink() for parent in [target,*target.parents]): raise SystemExit('Symlink target')
              paths.append(p);target.parent.mkdir(parents=True,exist_ok=True)
              if row.get('delete'): target.unlink(missing_ok=True);continue
              if 'content' in row: target.write_text(row['content'],encoding='utf-8')
              else:
                  sha=row.get('blob',row.get('base',''))
                  if not re.fullmatch('[0-9a-f]{40}',sha): raise SystemExit('Invalid source object')
                  target.write_bytes(subprocess.check_output(['git','cat-file','blob',sha]))
                  if 'patch' in row:
                      patch=row['patch'].encode()
                      stats=subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()
                      if [s.split('\t')[-1] for s in stats]!=[p]: raise SystemExit('Patch outside exact file')
                      subprocess.run(['git','apply','--check','-'],input=patch,check=True)
                      subprocess.run(['git','apply','-'],input=patch,check=True)
              actual=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if actual!=row['expected']: raise SystemExit('Output checksum mismatch: '+p)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','-r','--','.consolidation'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('PASS: 18 reviewed files reconstructed with exact object checksums; workflows unchanged')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate reviewed Wiki export, combined reminder and current Bot guidance'
      - name: Push only the authorised consolidation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/chore/docs-and-branch-consolidation
