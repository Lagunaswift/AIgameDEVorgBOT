name: Apply Wiki export integration
on:
  push:
    branches: [feat/project-wiki-v2-3]
    paths: [.github/workflows/wiki-integrate.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lagunaswift/AIgameDEVorgBOT' && github.ref == 'refs/heads/feat/project-wiki-v2-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-wiki-v2-3
      - name: Apply exact export integration and remove temporary files
        run: |
          sed -i 's/^ diff --git /diff --git /' .github/wiki-integration.patch
          echo '9934d387a3c6a9afb7598a157f826d27a6f0ee8640bce8ca9b229ddba238951b  .github/wiki-integration.patch' | sha256sum --check
          git apply --check --index .github/wiki-integration.patch
          git apply --index .github/wiki-integration.patch
          test "$(git hash-object .github/workflows/export-site.yml)" = 931a9b8caa981d6adacdbc9cccf33e0b4523f09b
          test "$(git hash-object scripts/export-site-data.mjs)" = 25f5e41668ecafc2cd5638f21e171d9a55203674
          test "$(git hash-object src/lib/project-wiki/contracts.mjs)" = 1395ee49b36091d33da7a5a330d830529eff04a6
          git rm -f .github/wiki-integration.patch .github/workflows/wiki-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire exact approved Wiki sidecar into staged export'
          git push origin HEAD:feat/project-wiki-v2-3
