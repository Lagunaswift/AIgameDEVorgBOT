name: Hosted Builds Jam Platform

on:
  push:
    branches:
      - feat/hosted-builds-jam-platform
  pull_request:
    paths:
      - 'src/lib/hostedBuilds.js'
      - 'src/services/hostedBuilds.js'
      - 'src/services/jams.js'
      - 'src/events/threadUpdate.js'
      - 'src/commands/jam.js'
      - 'src/commands/build.js'
      - 'test/hosted-builds*.test.mjs'
      - 'docs/hosted-builds-bot-plan.md'
      - '.github/workflows/hosted-builds-jam-platform.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
