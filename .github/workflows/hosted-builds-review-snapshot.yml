name: Hosted Builds review snapshot

on:
  push:
    branches: [feat/hosted-builds-jam-platform]
    paths: [.github/workflows/hosted-builds-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-builds-review-source
          path: source.tar
          retention-days: 1
          if-no-files-found: error
