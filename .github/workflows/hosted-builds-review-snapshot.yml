name: Hosted Builds review snapshot

on:
  push:
    branches: [feat/hosted-builds-jam-platform]
    paths: [.github/workflows/hosted-builds-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive locked dependencies only
        run: tar -cf dependencies.tar node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-builds-review-dependencies
          path: dependencies.tar
          retention-days: 1
          if-no-files-found: error
