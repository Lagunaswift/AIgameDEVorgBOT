name: Media review source
on:
  push:
    branches: [feat/project-media-v2-3]
    paths: [.github/workflows/media-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: media-review-source
          path: source.tar
          retention-days: 1
          if-no-files-found: error
