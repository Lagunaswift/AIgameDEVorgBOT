name: Prepare verified Project publishing export
on:
  push:
    branches: [feat/project-publishing-v2]
    paths:
      - .github/release-inputs/project-publishing.b64
      - .github/workflows/prepare-project-publishing.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lagunaswift/AIgameDEVorgBOT' && github.ref == 'refs/heads/feat/project-publishing-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply source without changing workflows
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.github/release-inputs/project-publishing.b64').read_text()
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) < 1048576
          assert hashlib.sha256(raw).hexdigest() == '51abfbefd231ee10d321f2726177bc1d0b761a845b6263f2e6a560771edfd8c3'
          Path('/tmp/project-publishing.patch').write_bytes(raw)
          PY
          git apply --check --exclude='.github/workflows/*' /tmp/project-publishing.patch
          git apply --exclude='.github/workflows/*' /tmp/project-publishing.patch
          git rm .github/release-inputs/project-publishing.b64
          git add src scripts test
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Commit readable export source on the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'Lagunaswift/AIgameDEVorgBOT'
          test "$GITHUB_REF" = 'refs/heads/feat/project-publishing-v2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export approved V2.1 Project releases and roadmap without drafts'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/project-publishing-v2
