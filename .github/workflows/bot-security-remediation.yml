name: Bot security remediation

on:
  push:
    branches:
      - chore/bot-security-baseline

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GUILD_ID: '1051088980176805919'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/bot-security-baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install baseline
        run: npm ci

      - name: Capture production audit before fixes
        run: npm audit --omit=dev --json > audit-before.json || true

      - name: Apply compatible audit fixes only
        run: npm audit fix

      - name: Restore complete dependency tree
        run: npm install --ignore-scripts=false

      - name: Require clean production audit
        run: npm audit --omit=dev

      - name: Run full unit suite
        run: npm test

      - name: Run full suite with Firestore emulator
        env:
          GCLOUD_PROJECT: demo-aigdbot-r2
          REQUIRE_FIRESTORE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --only firestore
          --project demo-aigdbot-r2
          --config .github/firebase-emulator.json
          "node --test test/*.test.mjs"

      - name: Refuse unexpected file changes
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -vE '^(package.json|package-lock.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit compatible dependency fixes
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible package changes were required."
            exit 0
          fi
          git config user.name "Lagunaswift"
          git config user.email "jamesswift1988@gmail.com"
          git add package.json package-lock.json
          git commit -m "Patch Bot production dependency advisories"
          git push origin HEAD:chore/bot-security-baseline
