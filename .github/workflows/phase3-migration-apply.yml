# Temporary, one-shot production migration. Remove this workflow immediately after
# the pinned apply run succeeds. The migration plan and reports contain internal IDs,
# so they stay only on the ephemeral runner and are never uploaded as artifacts.
name: Apply Phase 3 migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PHASE_3 to authorize the one-time production write
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase-3-migration-verification
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: phase3-production-migration
    env:
      VERIFIED_BOT_SHA: 642c3f4f360fa47f60c28abb807189922dc483a4
      VERIFIED_RUN_ID: '33991040113'
      EXPECTED_FIREBASE_PROJECT: aigamedevorgbot
      EXPECTED_DATABASE: '(default)'
      EXPECTED_PROJECTS: '9'
    steps:
      - name: Verify operator confirmation and pinned verification run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const confirmation = context.payload.inputs?.confirmation;
            if (confirmation !== 'APPLY_PHASE_3') {
              core.setFailed('confirmation must exactly equal APPLY_PHASE_3');
              return;
            }

            const runId = Number(process.env.VERIFIED_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.name !== 'Verify Phase 3 migration' ||
                run.event !== 'workflow_dispatch' ||
                run.head_sha !== process.env.VERIFIED_BOT_SHA ||
                run.conclusion !== 'success') {
              core.setFailed(`verification run ${runId} is not the approved successful run for ${process.env.VERIFIED_BOT_SHA}`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const requiredJobs = ['firestore-emulator', 'live-dry-run'];
            for (const name of requiredJobs) {
              const job = jobs.find((candidate) => candidate.name === name);
              if (!job || job.conclusion !== 'success') {
                core.setFailed(`verification run ${runId} lacks successful ${name} job`);
                return;
              }
            }

      - name: Checkout verified bot revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.VERIFIED_BOT_SHA }}
          persist-credentials: false

      - name: Checkout current site baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lagunaswift/AIGAMEDEVSITE
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate fresh production plan
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          SITE_PUBLISH_TAG_ID: ${{ vars.SITE_PUBLISH_TAG_ID }}
        shell: bash
        run: |
          npm run migrate:projects -- \
            --baseline site/src/data/showcase.json \
            --out "$RUNNER_TEMP/phase3-migration" \
            > "$RUNNER_TEMP/phase3-preflight.log" 2>&1

      - name: Validate exact apply scope
        id: plan
        env:
          PLAN_DIR: ${{ runner.temp }}/phase3-migration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const files = (await fs.readdir(process.env.PLAN_DIR))
            .filter((name) => /^plan-.*\.json$/.test(name));
          if (files.length !== 1) {
            throw new Error(`expected exactly one migration plan, found ${files.length}`);
          }

          const planPath = path.join(process.env.PLAN_DIR, files[0]);
          const plan = JSON.parse(await fs.readFile(planPath, 'utf8'));
          const expected = Number(process.env.EXPECTED_PROJECTS);
          const { create, alreadyLinked, blocked, conflict, baselineGames } = plan.counts;
          if (plan.version !== 2 ||
              plan.target?.firebaseProject !== process.env.EXPECTED_FIREBASE_PROJECT ||
              plan.target?.database !== process.env.EXPECTED_DATABASE) {
            throw new Error('migration plan version or Firebase target is not approved');
          }
          if (create !== expected || alreadyLinked !== 0 || blocked !== 0 ||
              conflict !== 0 || baselineGames !== expected) {
            throw new Error(`unexpected apply scope: create=${create}, alreadyLinked=${alreadyLinked}, blocked=${blocked}, conflict=${conflict}, baselineGames=${baselineGames}`);
          }
          const applicable = plan.records.filter(({ disposition }) =>
            disposition === 'create' || disposition === 'already-linked');
          if (applicable.length !== expected || applicable.some(({ disposition }) => disposition !== 'create')) {
            throw new Error('applicable record set is not exactly the nine approved creates');
          }
          const lostBaseline = plan.baseline.differences.filter(({ difference }) =>
            difference === 'baseline-public-but-not-migratable' ||
            difference === 'in-baseline-but-not-eligible');
          if (lostBaseline.length > 0) {
            throw new Error(`${lostBaseline.length} baseline Project(s) are not safely migratable`);
          }

          await fs.appendFile(process.env.GITHUB_OUTPUT, `path=${planPath}\n`);
          NODE

      - name: Apply migration atomically
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          SITE_PUBLISH_TAG_ID: ${{ vars.SITE_PUBLISH_TAG_ID }}
        shell: bash
        run: |
          npm run migrate:projects -- \
            --apply \
            --plan "${{ steps.plan.outputs.path }}" \
            --baseline site/src/data/showcase.json \
            --out "$RUNNER_TEMP/phase3-migration" \
            --firebase-project "$EXPECTED_FIREBASE_PROJECT" \
            --database "$EXPECTED_DATABASE" \
            > "$RUNNER_TEMP/phase3-apply.log" 2>&1

      - name: Verify apply report
        env:
          PLAN_DIR: ${{ runner.temp }}/phase3-migration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const files = (await fs.readdir(process.env.PLAN_DIR))
            .filter((name) => /^apply-.*\.json$/.test(name) && !name.startsWith('apply-failed-'));
          if (files.length !== 1) {
            throw new Error(`expected exactly one successful apply report, found ${files.length}`);
          }
          const report = JSON.parse(await fs.readFile(path.join(process.env.PLAN_DIR, files[0]), 'utf8'));
          const expected = Number(process.env.EXPECTED_PROJECTS);
          if (report.target?.firebaseProject !== process.env.EXPECTED_FIREBASE_PROJECT ||
              report.target?.database !== process.env.EXPECTED_DATABASE ||
              report.outcomes.length !== expected ||
              report.outcomes.some(({ result }) => result !== 'committed')) {
            throw new Error('apply report does not prove the nine approved commits');
          }
          NODE

      - name: Reconcile with a post-apply dry run
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          SITE_PUBLISH_TAG_ID: ${{ vars.SITE_PUBLISH_TAG_ID }}
        shell: bash
        run: |
          npm run migrate:projects -- \
            --baseline site/src/data/showcase.json \
            --out "$RUNNER_TEMP/phase3-reconcile" \
            > "$RUNNER_TEMP/phase3-reconcile.log" 2>&1

      - name: Verify reconciled production state
        env:
          PLAN_DIR: ${{ runner.temp }}/phase3-reconcile
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const files = (await fs.readdir(process.env.PLAN_DIR))
            .filter((name) => /^plan-.*\.json$/.test(name));
          if (files.length !== 1) {
            throw new Error(`expected exactly one reconciliation plan, found ${files.length}`);
          }
          const plan = JSON.parse(await fs.readFile(path.join(process.env.PLAN_DIR, files[0]), 'utf8'));
          const expected = Number(process.env.EXPECTED_PROJECTS);
          const { create, alreadyLinked, blocked, conflict, baselineGames } = plan.counts;
          if (create !== 0 || alreadyLinked !== expected || blocked !== 0 ||
              conflict !== 0 || baselineGames !== expected) {
            throw new Error(`production did not reconcile: create=${create}, alreadyLinked=${alreadyLinked}, blocked=${blocked}, conflict=${conflict}, baselineGames=${baselineGames}`);
          }
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,
            `## Phase 3 production apply\n\n- Verified source: ${process.env.VERIFIED_BOT_SHA}\n- Verified run: ${process.env.VERIFIED_RUN_ID}\n- Committed: ${expected}\n- Reconciled create: ${create}\n- Reconciled already linked: ${alreadyLinked}\n- Blocked: ${blocked}\n- Conflicts: ${conflict}\n`);
          NODE
